<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ศึกพิทักษ์กรุงศรี</title>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&family=Chonburi&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#3a1d12;font-family:"Kanit",Tahoma,sans-serif;color:#fff}
  canvas{position:fixed;inset:0;width:100vw;height:100vh}
  video{display:none}
  .card{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;width:min(900px,90vw);max-height:92vh;overflow:auto;box-sizing:border-box;
        display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:30px 28px;
        background:linear-gradient(170deg,#fff6e3,#f6e2bd);color:#4a2a12;border-radius:26px;
        border:5px solid #c8962c;box-shadow:0 0 0 3px #7a3b14,0 20px 50px rgba(0,0,0,.45)}
  .card h1{margin:0;font-family:"Chonburi","Kanit",serif;font-weight:400;font-size:clamp(34px,5.4vw,62px);line-height:1.2;color:#9a2a16;text-shadow:0 3px 0 #e8c26a}
  .card p{font-size:clamp(17px,2vw,23px);margin:0;line-height:1.5}
  .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center}
  button{font:inherit;font-size:clamp(19px,2.2vw,26px);font-weight:800;padding:12px 32px;border:3px solid #7a3b14;border-radius:999px;cursor:pointer;color:#fff;
         background:linear-gradient(180deg,#d94a2b,#a8301a);box-shadow:0 5px 0 #6e1f10,0 10px 20px rgba(0,0,0,.2)}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 #6e1f10}
  button.blue{background:linear-gradient(180deg,#e0a83a,#b97d16);box-shadow:0 5px 0 #7a5208,0 10px 20px rgba(0,0,0,.2)}
  button.pink{background:linear-gradient(180deg,#d94a2b,#a8301a)}
  .legend span{font-weight:800;padding:6px 16px;border-radius:999px;color:#2b1a0c;font-size:clamp(15px,1.7vw,20px)}
  .hidden{display:none!important}
  #status{font-size:16px;color:#8a6a4a}
</style>
</head>
<body>
<video id="video" playsinline muted></video>
<canvas id="c"></canvas>
<canvas id="u"></canvas>

<div id="start" class="card">
  <h1>ศึกพิทักษ์กรุงศรี!</h1>
  <p>ทัพเชื้อโรคในชุดเกราะกำลังบุกกรุงศรีอยุธยา!<br><b>ปัดมือฟาด</b>เชื้อโรคก่อนมันเข้าถึงทหารกรุงศรี คว้าไอเท็มช่วยรบด้วยนะ</p>
  <div class="row legend">
    <span style="background:#7be39a">สบู่ ล้างเชื้อทั้งจอ</span><span style="background:#8fd3ff">หน้ากาก โล่กันเมือง</span>
    <span style="background:#ffcf33">วัคซีน เชื้อโรคช้าลง</span><span style="background:#ff8a3d">ผลไม้ ฟื้นพลังเมือง</span>
  </div>
  <div class="row">
    <button class="pink" onclick="startGame()">เริ่มศึก!</button>
  </div>
  <p style="font-size:16px;color:#8a6a4a">เล่นคนเดียว (ใช้ได้ 2 มือ) หรือช่วยกัน 2 คนก็ได้</p>
  <div id="status">กำลังเปิดกล้อง...</div>
</div>

<div id="end" class="card hidden">
  <h1 id="endTitle"></h1>
  <p id="endText"></p>
  <div class="row"><button class="blue" onclick="showStart()">กลับเมนู</button></div>
</div>

<script type="module">
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const ucanvas = document.getElementById('u'), U = ucanvas.getContext('2d');
const video = document.getElementById('video'), statusEl = document.getElementById('status');
let DPR = 1;
const INK = 'rgba(60,20,8,.85)', PAPER = 'rgba(90,30,14,.88)', THAI = 'Kanit,Tahoma,sans-serif';
const HAND_COLORS = ['#8fe9ff', '#ff8ec3'];
let W, H;

// ---------- ข้อมูล ----------
const TYPES = {
  cold:   {hp:1, speed:0.075, r:0.032, dmg:8,  pts:10, name:'เชื้อหวัด'},
  bact:   {hp:1, speed:0.065, r:0.034, dmg:8,  pts:15, name:'แบคทีเรีย', split:true},
  virus:  {hp:3, speed:0.06,  r:0.038, dmg:12, pts:30, name:'ไวรัสเกราะเหล็ก'},
  minion: {hp:1, speed:0.09,  r:0.026, dmg:5,  pts:5,  name:'ลูกสมุน'},
  boss:   {hp:36,speed:0.024, r:0.09,  dmg:40, pts:500,name:'จอมโรคห่า'},
};
const WAVES = [
  {title:'ศึกที่ 1: ทัพเชื้อหวัด', fact:'เชื้อหวัดติดต่อทางละอองไอจาม ปิดปากเวลาไอนะ', mix:{cold:1}, n:14, gap:[1.8,1.0], speed:1},
  {title:'ศึกที่ 2: กองทัพแบคทีเรีย', fact:'แบคทีเรียแบ่งตัวได้เร็วมาก ถ้าปล่อยไว้จะเพิ่มเป็นสองเท่า!', mix:{cold:0.5, bact:0.5}, n:22, gap:[1.3,0.65], speed:1.15},
  {title:'ศึกที่ 3: ไวรัสเกราะเหล็ก', fact:'ไวรัสตัวเล็กมาก ต้องใช้กล้องจุลทรรศน์อิเล็กตรอนถึงจะเห็น', mix:{cold:0.35, bact:0.35, virus:0.3}, n:30, gap:[1.0,0.4], speed:1.3, rush:true},
  {title:'ศึกสุดท้าย: จอมโรคห่า!', fact:'ตามตำนาน พระเจ้าอู่ทองย้ายมาสร้างกรุงศรีอยุธยาเพราะหนีโรคระบาด', boss:true, speed:1.4},
];
const ITEMS = {
  soap:    {name:'สบู่',      col:'#7be39a', fact:'ล้างมือด้วยสบู่ 20 วินาที ช่วยกำจัดเชื้อโรคได้!'},
  mask:    {name:'หน้ากาก',  col:'#8fd3ff', fact:'หน้ากากช่วยกันละอองไอจามที่มีเชื้อโรค'},
  vaccine: {name:'วัคซีน',   col:'#ffcf33', fact:'วัคซีนช่วยให้ร่างกายรู้จักเชื้อโรคไว้ก่อน'},
  fruit:   {name:'ผลไม้',    col:'#ff8a3d', fact:'กินผักผลไม้ ช่วยให้ภูมิคุ้มกันแข็งแรง'},
};
const RANKS = [[20,'เจ้าพระยามหาภูมิคุ้มกัน'],[10,'พระยาปราบโรค'],[5,'ขุนพลภูมิคุ้มกัน']];

let state = 'menu', lastT = 0, countdown = 0, lastBeep = 4;
let wave = 0, waveT = 0, spawned = 0, nextSpawn = 0, intro = 0;
let germs = [], items = [], particles = [], floaters = [], hands = [];
let cityHP = 100, score = 0, kills = 0, combo = 0, comboT = 0, bestCombo = 0, rankShown = '';
let rage = false, bossSpawnT = 0, bossKilled = false, shieldT = 0, slowT = 0, itemTimer = 8, fact = null, drumT = 0, shake = 0, cough = [0,0,0,0,0], boss = null;

function resize(){
  DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  canvas.width = W*DPR; canvas.height = H*DPR; ucanvas.width = W*DPR; ucanvas.height = H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0); U.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize);
const city = () => ({x: W/2, y: H*0.8, rx: Math.min(W*0.24, H*0.5), ry: H*0.13});
const unit = () => Math.min(W, H*1.6);

// ---------- เสียง ----------
let actx = null;
function audio(){ if (!actx) try { actx = new (window.AudioContext||window.webkitAudioContext)(); } catch {} return actx; }
function tone(f, d=0.15, type='square', vol=0.1, delay=0, f2=null){
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t+d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.05);
}
function noise(d=0.15, vol=0.12){
  const a = audio(); if (!a) return;
  const b = a.createBuffer(1, a.sampleRate*d, a.sampleRate), ch = b.getChannelData(0);
  for (let i=0;i<ch.length;i++) ch[i] = (Math.random()*2-1) * (1 - i/ch.length);
  const s = a.createBufferSource(), g = a.createGain(); g.gain.value = vol; s.buffer = b; s.connect(g).connect(a.destination); s.start();
}
const sfx = {
  hit:   ()=>{ noise(0.08, 0.15); tone(500, 0.06, 'square', 0.07); },
  armor: ()=> tone(1400, 0.08, 'triangle', 0.1),
  pop:   n => { tone(700 + Math.min(n,10)*60, 0.09, 'square', 0.08); tone(1100 + Math.min(n,10)*60, 0.1, 'square', 0.06, 0.06); },
  hurt:  ()=>{ tone(160, 0.25, 'sawtooth', 0.12, 0, 80); },
  gong:  ()=>{ tone(110, 1.6, 'sine', 0.25); tone(165, 1.2, 'sine', 0.1); tone(220, 0.8, 'triangle', 0.06); },
  drum:  ()=> tone(70, 0.12, 'sine', 0.22, 0, 45),
  item:  ()=> [660,880,1100,1320].forEach((f,i)=>tone(f,0.1,'square',0.08,i*0.06)),
  soap:  ()=>{ noise(0.6, 0.15); [523,784,1046].forEach((f,i)=>tone(f,0.2,'triangle',0.1,i*0.1)); },
  roar:  ()=>{ tone(90, 0.9, 'sawtooth', 0.15, 0, 50); noise(0.5, 0.1); },
  rank:  ()=> [523,659,784,1046].forEach((f,i)=>tone(f,0.16,'square',0.09,i*0.09)),
  beep:  ()=> tone(520, 0.15, 'square', 0.1),
  go:    ()=> tone(880, 0.35, 'square', 0.12),
  win:   ()=> [523,659,784,1046,1318,1568].forEach((f,i)=>tone(f,0.25,'square',0.1,i*0.12)),
  lose:  ()=> [392,330,262,196].forEach((f,i)=>tone(f,0.35,'triangle',0.12,i*0.25)),
};

// ---------- เมนู ----------
window.showStart = ()=>{
  state = 'menu';
  document.getElementById('end').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
};
window.startGame = ()=>{
  audio();
  germs = []; items = []; particles = []; floaters = []; boss = null;
  cityHP = 100; score = 0; kills = 0; combo = 0; bestCombo = 0; rankShown = '';
  shieldT = 0; slowT = 0; itemTimer = 8; fact = null; wave = 0; WAVES.forEach(w => delete w.spawnedBoss); bossKilled = false; rage = false; bossSpawnT = 0;
  state = 'countdown'; countdown = 3.999; lastBeep = 4;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('end').classList.add('hidden');
};
addEventListener('keydown', e=>{
  if (e.code === 'Space' && state === 'over') showStart();
  if (e.code === 'Escape') showStart();
});
function beginWave(){ intro = 3.2; waveT = 0; spawned = 0; nextSpawn = 0.5; sfx.gong(); }

// ---------- เชื้อโรค ----------
function spawnGerm(type, at){
  const T = TYPES[type], u = unit(), side = at || pickSide();
  let x, y, boat = false, fly = false;
  if (side === 'left'){ x = -60; y = H*(0.62 + Math.random()*0.08); boat = Math.random() < 0.6; }
  else if (side === 'right'){ x = W + 60; y = H*(0.62 + Math.random()*0.08); boat = Math.random() < 0.6; }
  else { x = W*(0.1 + Math.random()*0.8); y = -60; fly = true; }
  const wsp = type === 'boss' ? 1 : ((WAVES[wave] && WAVES[wave].speed) || 1);
  const g = {type, x, y, hp:T.hp, max:T.hp, r:T.r*u, sp:T.speed*u*wsp, boat, fly, t:0, ph:Math.random()*6, hitCD:0, flash:0, kx:0, ky:0, split:false};
  germs.push(g); return g;
}
function pickSide(){ const r = Math.random(); return r < 0.35 ? 'left' : r < 0.7 ? 'right' : 'top'; }
function pickType(mix){ let r = Math.random(); for (const k in mix){ r -= mix[k]; if (r <= 0) return k; } return Object.keys(mix)[0]; }
function updateGerms(dt){
  const c = city(), target = {x: c.x, y: c.y - c.ry*0.6}, slow = slowT > 0 ? 0.4 : 1;
  for (const g of germs){
    g.t += dt; g.hitCD = Math.max(0, g.hitCD - dt); g.flash = Math.max(0, g.flash - dt);
    const dx = target.x - g.x, dy = target.y - g.y, d = Math.hypot(dx, dy) || 1;
    let sp = g.sp * slow;
    g.x += (dx/d*sp + g.kx)*dt; g.y += (dy/d*sp + g.ky)*dt;
    g.x += Math.sin(g.t*3 + g.ph)*12*dt*(g.fly?3:1);
    g.kx *= Math.pow(0.02, dt); g.ky *= Math.pow(0.02, dt);
    // แบคทีเรียแบ่งตัว
    if (TYPES[g.type].split && !g.split && g.t > 5){ g.split = true; const n = spawnGerm('bact', 'top'); n.x = g.x + g.r*2; n.y = g.y; n.split = true; n.t = 0; float(g.x, g.y - g.r*2, 'แบ่งตัว!', '#b48cff'); }
    // บอสเสกลูกสมุน
    if (g.type === 'boss' && !g.rage && g.hp <= g.max/2){ g.rage = true; g.sp *= 1.6; rage = true; shake = 0.8; sfx.roar(); banner = {text:'จอมโรคห่าคลั่งแล้ว!', sub:'ฟาดรัว ๆ เลย!', t:2.2}; }
    if (g.type === 'boss'){ g.summon = (g.summon || 2) - dt; if (g.summon <= 0){ g.summon = g.rage ? 1.5 : 2.6; for (let k=0;k<(g.rage?3:2);k++){ const m = spawnGerm('minion', 'top'); m.x = g.x + (k-1)*g.r*1.1; m.y = g.y - g.r*0.5; } sfx.roar(); } }
    // ถึงเมือง
    if (d < c.rx*0.35 + g.r){
      if (g.type === 'boss'){ // บอสโดนกำแพงแล้วถอยกลับไปตั้งหลัก
        if (shieldT <= 0){ cityHP = Math.max(0, cityHP - 20); sfx.hurt(); shake = 0.6; combo = 0; cough[2] = 1.2; }
        g.x = g.x < c.x ? -40 : W + 40; g.y = H*0.45; g.kx = g.ky = 0; sfx.roar();
        float(c.x, c.y - c.ry*2, 'จอมโรคห่าถอยทัพ!', '#ff6b5e'); continue;
      }
      g.dead = true;
      if (shieldT > 0){ burst(g.x, g.y, ['#8fd3ff','#fff'], 14); float(g.x, g.y, 'กันได้!', '#8fd3ff'); }
      else {
        cityHP = Math.max(0, cityHP - TYPES[g.type].dmg); sfx.hurt(); shake = 0.3; combo = 0;
        cough[Math.floor(Math.random()*cough.length)] = 1.2;
        burst(g.x, g.y, ['#ff6b5e','#fff'], 16);
      }
    }
  }
  germs = germs.filter(g => !g.dead);
}
function damageGerm(g, n, vx, vy){
  if (g.hitCD > 0) return;
  g.hitCD = 0.18; g.hp -= n; g.flash = 0.12;
  const s = Math.hypot(vx, vy) || 1; g.kx = vx/s*unit()*0.5; g.ky = vy/s*unit()*0.5;
  if (g.hp > 0){ g.type === 'virus' || g.type === 'boss' ? sfx.armor() : sfx.hit(); burst(g.x, g.y, ['#fff'], 6); return; }
  g.dead = true; kills++; combo++; comboT = 1.6; bestCombo = Math.max(bestCombo, combo);
  const pts = TYPES[g.type].pts * (1 + Math.floor(combo/5)); score += pts;
  sfx.pop(combo); burst(g.x, g.y, germColors(g.type), g.type === 'boss' ? 80 : 18);
  float(g.x, g.y - g.r, `+${pts}`, '#ffcf33');
  if (g.type === 'boss'){ boss = null; bossKilled = true; shake = 0.8; banner = {text:'ปราบจอมโรคห่าได้แล้ว!', t:2.2}; }
  for (const [n2, name] of RANKS){ if (combo === n2){ banner = {text: name, sub:`คอมโบ ${combo}!`, t: 2}; sfx.rank(); break; } }
}
function germColors(t){ return t==='cold' ? ['#7be39a','#3fbf5a'] : t==='bact' ? ['#b48cff','#7a4fd6'] : t==='virus' ? ['#ff6b5e','#c02e2e'] : t==='boss' ? ['#7a3fa0','#ffcf33','#ff6b5e'] : ['#9fe8a6','#5cc06a']; }

// ---------- ไอเท็ม ----------
function spawnItem(){
  const keys = Object.keys(ITEMS), k = cityHP < 60 && Math.random() < 0.5 ? 'fruit' : keys[Math.floor(Math.random()*keys.length)];
  items.push({k, x: W*(0.15 + Math.random()*0.7), y: -40, vy: H*0.12, t: 0});
}
function useItem(it){
  it.dead = true; sfx.item(); fact = {text: ITEMS[it.k].fact, title: ITEMS[it.k].name, col: ITEMS[it.k].col, t: 3.5};
  if (it.k === 'soap'){ sfx.soap(); shake = 0.4;
    for (const g of germs){ if (g.type === 'boss'){ g.hp = Math.max(1, g.hp - 4); g.flash = 0.3; } else { g.dead = true; kills++; score += TYPES[g.type].pts; burst(g.x, g.y, ['#ffffff','#bdf0ff','#7be39a'], 14); } }
    germs = germs.filter(g => !g.dead);
    for (let i=0;i<40;i++) particles.push({x:Math.random()*W, y:H+20, vx:(Math.random()-0.5)*80, vy:-200-Math.random()*300, c:'#e8fbff', life:2, g:-20, bub:true});
  }
  if (it.k === 'mask') shieldT = 7;
  if (it.k === 'vaccine') slowT = 7;
  if (it.k === 'fruit'){ cityHP = Math.min(100, cityHP + 25); float(W/2, city().y - city().ry, '+25 พลังเมือง', '#7be39a'); }
}
function updateItems(dt){
  for (const it of items){ it.t += dt; it.y += it.vy*dt; it.x += Math.sin(it.t*2)*30*dt; if (it.y > H*0.7) it.dead = true; }
  items = items.filter(i => !i.dead);
}

// ---------- มือ ----------
let handOK = false, landmarker = null, lastVideoTime = -1, mouseHand = null;
addEventListener('mousemove', e=>{ if (!handOK) mouseHand = {x:e.clientX, y:e.clientY}; });
async function initHands(){
  try{
    video.srcObject = await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'}});
    await video.play();
    statusEl.textContent = 'เปิดกล้องแล้ว กำลังโหลดตัวจับมือ...';
    const {FilesetResolver, HandLandmarker} = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fs = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = d => ({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate:d}, runningMode:'VIDEO', numHands:2});
    try { landmarker = await HandLandmarker.createFromOptions(fs, opts('GPU')); }
    catch { landmarker = await HandLandmarker.createFromOptions(fs, opts('CPU')); }
    handOK = true;
    statusEl.textContent = 'พร้อมรบ! ยืนห่างกล้องประมาณ 1–1.5 เมตร แล้วยกมือขึ้น';
  }catch(err){
    console.error(err);
    statusEl.textContent = 'เปิดกล้องหรือตัวจับมือไม่ได้ ตอนนี้เล่นด้วยเมาส์ได้ · ตรวจว่าอนุญาตกล้องและต่ออินเทอร์เน็ต';
  }
}
const mapPt = p => ({x:(1-(0.5+(p.x-0.5)*1.4))*W, y:(0.5+(p.y-0.5)*1.4)*H});
function trackHands(now){
  let found = [];
  if (handOK){
    if (video.readyState >= 2 && video.currentTime !== lastVideoTime){
      lastVideoTime = video.currentTime;
      const r = landmarker.detectForVideo(video, performance.now());
      found = (r.landmarks || []).map(L => ({pts: L.map(mapPt), c: mapPt({x:(L[0].x+L[9].x)/2, y:(L[0].y+L[9].y)/2})}));
      // จับคู่กับมือเดิมตามตำแหน่งใกล้สุด
      const next = found.map(f => {
        let best = null, bd = 1e9; for (const h of hands){ const d = Math.hypot(h.x - f.c.x, h.y - f.c.y); if (d < bd && !h.used){ bd = d; best = h; } }
        if (best && bd < W*0.3){ best.used = true; best.x += (f.c.x - best.x)*0.75; best.y += (f.c.y - best.y)*0.75; best.pts = f.pts; return best; }

      if (Math.hypot(g.x - h.x, g.y - h.y) < hr + g.r){

  }

}
function drawItem(it, t){
  const r = Math.min(W,H)*0.045, x = it.x, y = it.y, I = ITEMS[it.k];
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(x, y, r*1.3 + Math.sin(t/150)*4, 0, Math.PI*2); ctx.fill();
  circ(x, y, r, I.col); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.stroke();
  if (it.k === 'soap'){ rr(x - r*0.55, y - r*0.25, r*1.1, r*0.6, r*0.2, '#fff'); circ(x + r*0.35, y - r*0.5, r*0.16, 'rgba(255,255,255,.9)'); circ(x - r*0.05, y - r*0.62, r*0.1, 'rgba(255,255,255,.9)'); }
  if (it.k === 'mask'){ rr(x - r*0.55, y - r*0.3, r*1.1, r*0.62, r*0.2, '#fff'); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - r*0.55, y - r*0.15); ctx.lineTo(x - r*0.8, y - r*0.3); ctx.moveTo(x + r*0.55, y - r*0.15); ctx.lineTo(x + r*0.8, y - r*0.3); ctx.stroke(); ctx.strokeStyle = '#8fd3ff'; ctx.beginPath(); ctx.moveTo(x - r*0.35, y); ctx.lineTo(x + r*0.35, y); ctx.stroke(); }
  if (it.k === 'vaccine'){ rr(x - r*0.6, y - r*0.15, r*0.9, r*0.3, r*0.1, '#fff'); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + r*0.3, y); ctx.lineTo(x + r*0.75, y); ctx.moveTo(x - r*0.7, y - r*0.25); ctx.lineTo(x - r*0.7, y + r*0.25); ctx.stroke(); }
  if (it.k === 'fruit'){ circ(x, y + r*0.1, r*0.45, '#ff6b2d'); ctx.fillStyle = '#3fbf5a'; ctx.beginPath(); ctx.ellipse(x + r*0.15, y - r*0.42, r*0.2, r*0.1, -0.5, 0, Math.PI*2); ctx.fill(); }
}
const BONES=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function drawHands(){
  for (const h of hands){
    const hr = h.hr || Math.min(W,H)*0.031;
    // รอยฟาด
    ctx.lineCap = 'round';
    for (let i=1;i<h.trail.length;i++){ const a = h.trail[i-1], b = h.trail[i]; if (b.s < W*0.25) continue;
      ctx.strokeStyle = 'rgba(255,255,255,'+(i/h.trail.length*0.8)+')'; ctx.lineWidth = 22*i/h.trail.length; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
    // หน้าตามือแบบเดิม: เส้นบาง + จุดทุกข้อ + วงกลมกลางฝ่ามือ
    if (h.pts){
      ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.lineWidth=8; for (const [a,b] of BONES){ ctx.beginPath(); ctx.moveTo(h.pts[a].x,h.pts[a].y); ctx.lineTo(h.pts[b].x,h.pts[b].y); ctx.stroke(); }
      ctx.strokeStyle=h.col; ctx.lineWidth=4; for (const [a,b] of BONES){ ctx.beginPath(); ctx.moveTo(h.pts[a].x,h.pts[a].y); ctx.lineTo(h.pts[b].x,h.pts[b].y); ctx.stroke(); }
      ctx.fillStyle='#fff'; for (const q of h.pts){ ctx.beginPath(); ctx.arc(q.x,q.y,5,0,Math.PI*2); ctx.fill(); }
    }
    const fast = h.speed > W*0.25;
    ctx.beginPath(); ctx.arc(h.x, h.y, hr, 0, Math.PI*2);
    ctx.fillStyle = fast ? 'rgba(255,210,63,.18)' : 'rgba(255,255,255,.1)'; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 10; ctx.stroke();
    ctx.strokeStyle = fast ? '#ffd23f' : h.col; ctx.lineWidth = 6; ctx.stroke();
  }
}
function drawParticles(dt){
  for (const p of particles){
    p.vy += (p.g ?? 900)*dt; p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*1.2;
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.bub ? 9 : 5, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; particles = particles.filter(p => p.life > 0 && p.y < H+40 && p.y > -60);
}
// ---------- UI ----------
let banner = null;
function drawHUD(){
  const ctx = U, f = Math.max(17, Math.min(W,H)*0.036);
  ctx.font = `800 ${f}px ${THAI}`; ctx.textBaseline='middle'; ctx.textAlign='left';
  const txt = `ศึกที่ ${Math.min(wave+1,4)}/4    คะแนน ${score}`, w = ctx.measureText(txt).width + 36;
  sticker(16, 16, w, f*1.7, PAPER); ctx.fillStyle = '#fff'; ctx.fillText(txt, 34, 16+f*0.85);
  // พลังเมือง
  const bw = Math.min(W*0.28, 340), bx = W - bw - 32, by = 16;
  sticker(bx - f*4.2, by, bw + f*4.2 + 8, f*1.7, PAPER);
  ctx.fillStyle = '#fff'; ctx.fillText('พลังเมือง', bx - f*3.9, by + f*0.85);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.roundRect(bx, by + f*0.45, bw, f*0.8, f*0.4); ctx.fill();
  ctx.fillStyle = cityHP > 50 ? '#7be39a' : cityHP > 25 ? '#ffcf33' : '#ff6b5e'; ctx.beginPath(); ctx.roundRect(bx, by + f*0.45, Math.max(f*0.8, bw*cityHP/100), f*0.8, f*0.4); ctx.fill();
  // สถานะไอเท็ม
  let iy = 16 + f*1.7 + 20;
  const chip = (t, col)=>{ ctx.font = `800 ${f*0.75}px ${THAI}`; const w2 = ctx.measureText(t).width + 24; sticker(16, iy, w2, f*1.15, col); ctx.fillStyle = '#2b1a0c'; ctx.fillText(t, 28, iy + f*0.58); iy += f*1.15 + 18; };
  if (shieldT > 0) chip(`หน้ากากป้องกัน ${Math.ceil(shieldT)}`, '#8fd3ff');
  if (slowT > 0) chip(`วัคซีน เชื้อโรคช้าลง ${Math.ceil(slowT)}`, '#ffcf33');
  if (combo >= 2) chip(`คอมโบ x${combo}`, '#ff8ec3');
  // หลอดบอส
  if (boss && !boss.dead){
    const w3 = Math.min(W*0.5, 600), x3 = (W - w3)/2, y3 = 16 + f*1.7 + 30;
    label('จอมโรคห่า', W/2, y3 - 4, f*0.9, '#ff6b5e');
    ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.beginPath(); ctx.roundRect(x3, y3 + f*0.5, w3, f*0.7, f*0.35); ctx.fill();
    ctx.fillStyle = '#ff6b5e'; ctx.beginPath(); ctx.roundRect(x3, y3 + f*0.5, Math.max(f*0.7, w3*boss.hp/boss.max), f*0.7, f*0.35); ctx.fill();
  }
}
function drawFact(dt){
  if (!fact) return;
  fact.t -= dt; if (fact.t <= 0){ fact = null; return; }
  const ctx = U, f = Math.max(18, Math.min(W,H)*0.032), w = Math.min(W*0.8, 900), h = f*3.2, x = (W - w)/2, y = H*0.2;
  ctx.globalAlpha = Math.min(1, fact.t*2);
  sticker(x, y, w, h, PAPER);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `800 ${f}px ${THAI}`; ctx.fillStyle = fact.col; ctx.fillText(`ได้${fact.title}!`, W/2, y + f*0.95, w - 24);
  ctx.font = `${f*0.85}px ${THAI}`; ctx.fillStyle = '#fff'; ctx.fillText(fact.text, W/2, y + f*2.2, w - 24);
  ctx.globalAlpha = 1;
}
function drawFloaters(dt){
  for (const f of floaters){ f.t -= dt; f.y -= 60*dt; U.globalAlpha = Math.max(0, Math.min(1, f.t*2)); label(f.text, f.x, f.y, Math.max(18, Math.min(W,H)*0.035), f.col); }
  U.globalAlpha = 1; floaters = floaters.filter(f => f.t > 0);
}
function drawBanner(dt){
  if (!banner) return;
  banner.t -= dt; if (banner.t <= 0){ banner = null; return; }
  const s = 1 + Math.max(0, banner.t - 1.6)*1.5;
  label(banner.text, W/2, H*0.36, Math.min(W,H)*0.07*s, '#ffcf33');
  if (banner.sub) label(banner.sub, W/2, H*0.36 + Math.min(W,H)*0.075, Math.min(W,H)*0.04, '#fff');
}
function drawIntro(dt){
  intro -= dt;
  const Wv = WAVES[wave], f = Math.min(W,H)*0.04, w = Math.min(W*0.82, 920), h = f*4.4, x = (W-w)/2, y = H*0.2;
  sticker(x, y, w, h, PAPER);
  label(Wv.title, W/2, y + f*1.4, f*1.4, Wv.boss ? '#ff6b5e' : '#ffcf33');
  const ctx = U; ctx.font = `${f*0.78}px ${THAI}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(Wv.fact, W/2, y + f*3.2, w - 30);
}
function drawCountdown(dt){
  countdown -= dt;
  const n = Math.ceil(countdown);
  if (n !== lastBeep && n >= 1){ sfx.beep(); lastBeep = n; }
  if (countdown <= 0){ sfx.go(); state = 'play'; beginWave(); return; }
  const frac = countdown - Math.floor(countdown);
  label(String(n), W/2, H*0.32, Math.min(W,H)*(0.2 + 0.07*frac), '#ffcf33');
  label('ยกมือขึ้น เตรียมรบ!', W/2, H*0.5, Math.min(W,H)*0.05);
}

// ---------- ศึก ----------
function updateWave(dt){
  if (intro > 0) return;
  waveT += dt;
  const Wv = WAVES[wave];
  if (Wv.boss){
    if (!boss && !Wv.spawnedBoss){ Wv.spawnedBoss = true; boss = spawnGerm('boss', 'right'); boss.boat = false; boss.y = H*0.5; sfx.roar(); banner = {text:'จอมโรคห่ามาแล้ว!', sub:'ฟาดแรง ๆ หลายที!', t:2.2}; }
    if (!bossKilled && boss){ bossSpawnT -= dt; if (bossSpawnT <= 0){ bossSpawnT = rage ? 0.8 : 1.5; spawnGerm(Math.random() < 0.5 ? 'cold' : (Math.random() < 0.5 ? 'bact' : 'virus')); } }
    if (bossKilled){ rage = false; germs.forEach(g => { if (!g.dead){ g.dead = true; burst(g.x, g.y, germColors(g.type), 10); } }); germs = []; win(); }
    return;
  }
  if (spawned < Wv.n){
    nextSpawn -= dt;
    if (nextSpawn <= 0){
      spawnGerm(pickType(Wv.mix)); spawned++;
      if (Wv.rush && spawned > Wv.n*0.4 && spawned < Wv.n){ spawnGerm(pickType(Wv.mix)); spawned++; }
      if (Wv.rush && spawned === Math.ceil(Wv.n*0.4)){ banner = {text:'ทัพหนุนมาแล้ว!', sub:'เชื้อโรคบุกทีละ 2 ตัว!', t:1.8}; sfx.roar(); }
      const k = spawned / Wv.n; nextSpawn = Wv.gap[0] + (Wv.gap[1] - Wv.gap[0])*k;
    }
  } else if (!germs.length){ wave++; if (wave < WAVES.length) beginWave(); }
}
function win(){
  if (state !== 'play') return;
  state = 'over'; sfx.win();
  const cols = ['#ff5fa2','#3fb6ff','#ffcf33','#7be39a','#ffffff','#b48cff'];
  for (let i=0;i<240;i++) particles.push({x:Math.random()*W, y:-20-Math.random()*H*0.5, vx:(Math.random()-0.5)*120, vy:100+Math.random()*200, c:cols[i%6], life:3.5, g:30});
  const title = bestCombo >= 20 ? RANKS[0][1] : bestCombo >= 10 ? RANKS[1][1] : bestCombo >= 5 ? RANKS[2][1] : 'ทหารภูมิคุ้มกัน';
  setTimeout(()=>{
    pixelTitle(document.getElementById('endTitle'), 'กรุงศรีปลอดภัย!', '#7be39a');
    document.getElementById('endText').innerHTML = `ได้รับยศ <b style="color:#b8301a">${title}</b><br>คะแนน <b>${score}</b> · ปราบเชื้อโรค ${kills} ตัว · คอมโบสูงสุด x${bestCombo} · พลังเมืองเหลือ ${cityHP}%` +
      `<br><span style="font-size:.85em">จำไว้นะ: ล้างมือด้วยสบู่ · ใส่หน้ากากเมื่อป่วย · ฉีดวัคซีน · กินผักผลไม้ ภูมิคุ้มกันจะแข็งแรง!</span>`;
    document.getElementById('end').classList.remove('hidden');
  }, 1500);
}
function lose(){
  if (state !== 'play') return;
  state = 'over'; sfx.lose();
  setTimeout(()=>{
    pixelTitle(document.getElementById('endTitle'), 'กรุงแตกแล้ว!', '#ff6b5e');
    document.getElementById('endText').innerHTML = `ไปได้ถึง${WAVES[Math.min(wave,3)].title.split(':')[0]} · คะแนน <b>${score}</b> · ปราบเชื้อโรค ${kills} ตัว` +
      `<br><span style="font-size:.85em">ไม่เป็นไร! ลองใหม่อีกรอบ คว้าสบู่กับผลไม้ช่วยด้วยนะ</span>`;
    document.getElementById('end').classList.remove('hidden');
  }, 1200);
}

function loop(t){
  const dt = Math.min(0.05, (t-lastT)/1000 || 0); lastT = t;
  trackHands(t); U.clearRect(0,0,W,H);
  const sh = shake > 0 ? (Math.random()-0.5)*shake*40 : 0; shake = Math.max(0, shake - dt);
  ctx.setTransform(DPR,0,0,DPR,sh*DPR,0);
  drawBG(t);
  if (state !== 'menu'){
    if (state === 'play'){
      updateWave(dt);
      if (intro <= 0){
        updateGerms(dt); updateItems(dt); handleSwats();
        itemTimer -= dt; if (itemTimer <= 0){ spawnItem(); itemTimer = 10 + Math.random()*6; }
        shieldT = Math.max(0, shieldT - dt); slowT = Math.max(0, slowT - dt);
        comboT -= dt; if (comboT <= 0) combo = 0;
        drumT -= dt; if (drumT <= 0){ sfx.drum(); drumT = rage ? 0.22 : WAVES[wave] && WAVES[wave].boss ? 0.38 : WAVES[wave] && WAVES[wave].rush ? 0.45 : 0.7; }
        if (cityHP <= 0) lose();
      }
    }
    for (let i=0;i<cough.length;i++) cough[i] = Math.max(0, cough[i] - dt);
    drawCity(t);
    if (rage && state === 'play'){ const a = 0.38 + 0.18*Math.sin(t/120); const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.65); g.addColorStop(0,'rgba(200,0,0,0)'); g.addColorStop(1,`rgba(200,0,0,${a})`); ctx.fillStyle = g; ctx.fillRect(0,0,W,H); }
    germs.forEach(g => drawGerm(g, t));
    items.forEach(it => drawItem(it, t));
    if (state === 'play' || state === 'over') drawHUD();
    drawFloaters(dt); drawFact(dt); drawBanner(dt);
    if (state === 'countdown') drawCountdown(dt);
    if (state === 'play' && intro > 0) drawIntro(dt);
  }
  drawParticles(dt);
  drawHands();
  requestAnimationFrame(loop);
}
function pixelTitle(el, text, color){ el.textContent = text; el.style.color = color === '#7be39a' ? '#2f8a3a' : color === '#ff6b5e' ? '#b8301a' : ''; }
window.__spawn = (t, at) => spawnGerm(t, at);
window.__g = () => ({rage, germs, items, wave, intro, state, cityHP, score, kills, boss, WAVES});
resize(); initHands(); requestAnimationFrame(loop);
</script>
